<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>MentorLink — Messages</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = { theme: { extend: {
      colors: { brand: '#0965F0', ink: '#1B2330', muted: '#52607A', line: '#E4ECFB', app: '#F4F8FF' },
      fontFamily: { sans: ['Poppins', 'sans-serif'] }
    }}}
  </script>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <script src="https://unpkg.com/lucide@latest"></script>
  <style>
    html, body { height: 100%; }
    body { font-family: 'Poppins', sans-serif; color: #1B2330; background: #A8C0E4; }
    .no-sb { -ms-overflow-style: none; scrollbar-width: none; }
    .no-sb::-webkit-scrollbar { display: none; }
    .cv { display: none; }
    .cv.on { display: flex; }
  </style>
</head>
<body class="p-4 lg:p-6">

  <!-- Squelette de chargement (skeleton) -->
  <style>
    #skel{transition:opacity .4s ease}
    #skel.hide{opacity:0;pointer-events:none}
    .sk{background:#DDE7F7;position:relative;overflow:hidden}
    .sk::after{content:'';position:absolute;inset:0;transform:translateX(-100%);background:linear-gradient(90deg,transparent,rgba(255,255,255,.65),transparent);animation:sksh 1.3s infinite}
    @keyframes sksh{100%{transform:translateX(100%)}}
  </style>
  <div id="skel" class="fixed inset-0 z-[60] p-4 lg:p-6" style="background:#A8C0E4">
    <div class="max-w-[1280px] mx-auto h-[calc(100vh-2rem)] lg:h-[calc(100vh-3rem)] bg-white rounded-lg overflow-hidden flex">
      <div class="w-60 shrink-0 hidden lg:flex flex-col border-r border-line p-5">
        <div class="sk w-20 h-20 rounded-full mx-auto mb-8"></div>
        <div class="space-y-3">
          <div class="sk h-9 rounded-lg"></div>
          <div class="sk h-9 rounded-lg"></div>
          <div class="sk h-9 rounded-lg"></div>
        </div>
        <div class="sk mt-auto h-28 rounded-2xl"></div>
      </div>
      <div class="flex-1 p-6">
        <div class="sk h-12 w-2/5 rounded-full mb-6"></div>
        <div class="sk h-28 rounded-2xl mb-6"></div>
        <div class="grid grid-cols-2 gap-5">
          <div class="sk h-44 rounded-2xl"></div>
          <div class="sk h-44 rounded-2xl"></div>
          <div class="sk h-44 rounded-2xl"></div>
          <div class="sk h-44 rounded-2xl"></div>
        </div>
      </div>
    </div>
  </div>
  <script>window.addEventListener('load',function(){setTimeout(function(){var s=document.getElementById('skel');if(s){s.classList.add('hide');setTimeout(function(){s.style.display='none';},400);}},300);});</script>

  <div class="max-w-[1280px] mx-auto h-[calc(100vh-2rem)] lg:h-[calc(100vh-3rem)] bg-white rounded-lg overflow-hidden flex" style="box-shadow:0 -8px 24px rgba(11,27,58,.10), 0 18px 45px rgba(11,27,58,.20)">

    <!-- ===================== SIDEBAR (nav) ===================== -->
    <aside class="w-60 shrink-0 hidden lg:flex flex-col border-r border-line p-5">
      <div class="flex justify-center mb-8">
        <img src="./assets/img/logo.png" class="h-28 w-28 object-contain" />
      </div>
      <nav class="space-y-2">
        <a href="dashboard.html" class="flex items-center gap-2.5 px-3 h-9 text-[13px] text-muted font-medium hover:text-ink transition"><i data-lucide="home" class="w-[18px] h-[18px] stroke-[2.4]"></i> Tableau de bord</a>
        <a href="matching.html" class="flex items-center gap-2.5 px-3 h-9 text-[13px] text-muted font-medium hover:text-ink transition"><i data-lucide="users" class="w-[18px] h-[18px] stroke-[2.4]"></i> Mentors</a>
        <a href="offres.html" class="flex items-center gap-2.5 px-3 h-9 text-[13px] text-muted font-medium hover:text-ink transition"><i data-lucide="megaphone" class="w-[18px] h-[18px] stroke-[2.4]"></i> Offres <span id="offreBadge" class="ml-auto text-xs bg-brand text-white rounded-full w-5 h-5 flex items-center justify-center" style="display:none">0</span></a>
        <a href="chat.html" class="flex items-center gap-2.5 px-3 h-9 text-[13px] text-brand font-semibold"><i data-lucide="message-circle" class="w-[18px] h-[18px] stroke-[2.4]"></i> Messages <span id="msgBadge" class="ml-auto text-xs bg-brand text-white rounded-full w-5 h-5 flex items-center justify-center" style="display:none">0</span></a>
      </nav>
      <div class="mt-auto bg-brand/5 border border-brand/10 rounded-[2px] p-2 text-center">
        <img src="./assets/img/help.svg" class="h-12 mb-1 object-contain mx-auto" />
        <p class="font-semibold text-[13px]">Besoin d'aide ?</p>
        <p class="text-[10px] text-muted mt-0.5">Contacte-nous en cas de problème</p>
      </div>
      <a href="#" onclick="confirmLogout();return false;" class="flex items-center gap-2.5 px-3 h-9 mt-3 text-[13px] font-medium text-red-500 hover:text-red-600 transition"><i data-lucide="log-out" class="w-[18px] h-[18px] stroke-[2.4]"></i> Se déconnecter</a>
    </aside>

    <!-- ===================== CENTRE : chat (une colonne, 2 vues) ===================== -->
    <main class="flex-1 bg-white flex flex-col overflow-hidden">
      <div class="flex-1 flex flex-col overflow-hidden">

        <!-- ===== VUE 1 : LISTE ===== -->
        <div id="view-list" class="cv on flex-col h-full">
          <div class="p-5 border-b border-line">
            <div class="flex items-center justify-between mb-3">
              <h1 class="text-xl font-extrabold">Messages</h1>
              <button onclick="openNewConv()" title="Nouveau message (par email)" class="w-9 h-9 rounded-full bg-brand text-white flex items-center justify-center hover:brightness-110 transition shrink-0"><i data-lucide="pen-square" class="w-[18px] h-[18px]"></i></button>
            </div>
            <div class="relative">
              <i data-lucide="search" class="w-4 h-4 text-muted absolute left-3.5 top-1/2 -translate-y-1/2"></i>
              <input id="convSearch" type="text" oninput="filterConvs()" placeholder="Rechercher (nom, filière)…" class="w-full h-10 bg-app border border-line rounded-full pl-10 pr-3 text-sm focus:border-brand focus:outline-none transition" />
            </div>
          </div>
          <div id="convList" class="flex-1 overflow-y-auto no-sb divide-y divide-line"></div>
        </div>

        <!-- ===== VUE 2 : CONVERSATION ===== -->
        <div id="view-chat" class="cv flex-col h-full">
          <div class="flex items-center gap-3 p-4 border-b border-line">
            <button onclick="showView('list')" class="text-brand hover:opacity-70 transition shrink-0"><i data-lucide="arrow-left" class="w-6 h-6 stroke-[2.4]"></i></button>
            <img id="chatAvatar" onclick="openOtherProfile()" title="Voir le profil" src="./assets/img/profil.svg" class="w-10 h-10 rounded-full object-cover bg-app cursor-pointer hover:ring-2 hover:ring-brand/30 transition" alt="" />
            <div onclick="openOtherProfile()" class="cursor-pointer">
              <p id="chatName" class="font-semibold">Conversation</p>
              <p class="text-xs text-brand flex items-center gap-1"><span class="w-1.5 h-1.5 rounded-full bg-brand inline-block"></span> En ligne</p>
            </div>
            <div class="ml-auto relative">
              <button onclick="toggleChatMenu(event)" class="w-9 h-9 rounded-full hover:bg-app text-muted flex items-center justify-center transition"><i data-lucide="more-vertical" class="w-[18px] h-[18px]"></i></button>
              <div id="chatMenu" class="hidden absolute right-0 top-11 z-30 w-56 bg-white rounded-xl border border-line shadow-xl overflow-hidden">
                <button id="menuBlockBtn" onclick="toggleBlockCurrent()" class="w-full flex items-center gap-2.5 px-4 py-2.5 text-sm text-ink hover:bg-app transition text-left"><i data-lucide="ban" class="w-4 h-4 text-muted"></i> Bloquer</button>
                <button onclick="deleteCurrentConv()" class="w-full flex items-center gap-2.5 px-4 py-2.5 text-sm text-red-600 hover:bg-red-50 transition text-left"><i data-lucide="trash-2" class="w-4 h-4"></i> Supprimer la conversation</button>
              </div>
            </div>
          </div>

          <div id="msgBox" class="flex-1 overflow-y-auto no-sb p-5 space-y-3 bg-[#F4F8FF]"></div>

          <div id="composer" class="p-3 border-t border-line flex items-center gap-2">
            <input id="fileInput" type="file" class="hidden" onchange="sendFile(this)" />
            <button onclick="document.getElementById('fileInput').click()" title="Joindre un fichier" class="w-11 h-11 rounded-full hover:bg-app text-muted flex items-center justify-center transition shrink-0"><i data-lucide="paperclip" class="w-[18px] h-[18px]"></i></button>
            <button id="micBtn" onclick="toggleRecord()" title="Message vocal" class="w-11 h-11 rounded-full hover:bg-app text-muted flex items-center justify-center transition shrink-0"><i data-lucide="mic" class="w-[18px] h-[18px]"></i></button>
            <input id="msgInput" type="text" placeholder="Écris un message…" class="flex-1 h-11 bg-app border border-line rounded-full px-4 text-sm focus:bg-white focus:border-brand focus:outline-none transition" />
            <button onclick="sendMsg()" class="w-11 h-11 rounded-full bg-brand hover:brightness-110 text-white flex items-center justify-center transition shrink-0"><i data-lucide="send" class="w-[18px] h-[18px]"></i></button>
          </div>
          <!-- Affiché à la place du composer quand la conversation est bloquée -->
          <div id="blockNotice" class="hidden p-4 border-t border-line bg-app text-center"></div>
        </div>

      </div>
    </main>

  </div>

  <!-- ===================== MODALE NOUVEAU MESSAGE (par email) ===================== -->
  <div id="newConvModal" class="fixed inset-0 z-[80] hidden items-center justify-center bg-black/40 p-4">
    <div class="bg-white rounded-2xl w-full max-w-sm p-6">
      <div class="flex items-center justify-between mb-1">
        <h2 class="text-lg font-extrabold flex items-center gap-2"><i data-lucide="mail" class="w-5 h-5 text-brand"></i> Nouveau message</h2>
        <button onclick="closeNewConv()" class="w-9 h-9 rounded-full hover:bg-app text-muted flex items-center justify-center transition"><i data-lucide="x" class="w-5 h-5"></i></button>
      </div>
      <p class="text-sm text-muted mb-4">Saisis l'adresse email de la personne à contacter.</p>
      <input id="newConvEmail" type="email" placeholder="email@ifri.bj" onkeydown="if(event.key==='Enter')startByEmail()" class="w-full h-11 bg-app border border-line rounded-xl px-3 text-sm focus:border-brand focus:outline-none transition" />
      <button onclick="startByEmail()" class="w-full h-11 mt-4 rounded-full bg-brand hover:brightness-110 text-white font-semibold transition flex items-center justify-center gap-2"><i data-lucide="message-circle" class="w-4 h-4"></i> Ouvrir la conversation</button>
    </div>
  </div>

  <!-- ===================== MODALE PROFIL (interlocuteur) ===================== -->
  <div id="chatProfileModal" class="fixed inset-0 z-[80] hidden items-center justify-center bg-black/40 p-4">
    <div class="bg-white rounded-2xl w-full max-w-md max-h-[90vh] overflow-y-auto no-sb">
      <div class="relative h-32 overflow-hidden" style="background:#A8C0E4">
        <img src="./assets/img/logo.png" alt="MentorLink" class="absolute left-1/2 top-1/2 -translate-x-1/2 -translate-y-1/2 h-24 object-contain pointer-events-none select-none" />
        <button onclick="closeChatProfile()" class="absolute top-3 right-3 w-9 h-9 rounded-full bg-white/80 hover:bg-white text-ink flex items-center justify-center transition"><i data-lucide="x" class="w-5 h-5"></i></button>
      </div>
      <div class="px-6 pb-6">
        <img id="cp_photo" onclick="showImage(this.src)" title="Voir en grand" src="./assets/img/profil.svg" alt="" class="w-20 h-20 rounded-full object-cover bg-white -mt-10 ring-4 ring-white shadow-lg relative z-10 cursor-zoom-in" />
        <h2 id="cp_name" class="mt-3 text-xl font-extrabold leading-tight">…</h2>
        <p id="cp_role" class="text-sm text-muted mt-0.5">…</p>
        <p id="cp_bio" class="text-sm text-ink/80 mt-2" style="display:none"></p>
        <div class="mt-4">
          <p class="text-xs font-semibold text-muted mb-2 flex items-center gap-1.5"><i data-lucide="star" class="w-3.5 h-3.5"></i> Points forts</p>
          <div id="cp_skills" class="flex flex-wrap gap-1.5"></div>
        </div>
        <div id="cp_phone_wrap" class="mt-4" style="display:none">
          <p class="text-xs font-semibold text-muted mb-1 flex items-center gap-1.5"><i data-lucide="phone" class="w-3.5 h-3.5"></i> Téléphone</p>
          <a id="cp_phone" href="#" class="text-sm font-semibold text-brand"></a>
        </div>
      </div>
    </div>
  </div>

  <!-- Menu flottant d'un message (Modifier / Supprimer) -->
  <div id="msgMenu" class="hidden fixed z-40 w-40 bg-white rounded-xl border border-line shadow-xl overflow-hidden">
    <button id="menuEditBtn" onclick="editMsg()" class="w-full flex items-center gap-2 px-3 py-2 text-sm text-ink hover:bg-app transition text-left"><i data-lucide="pencil" class="w-4 h-4 text-muted"></i> Modifier</button>
    <button onclick="deleteMsg()" class="w-full flex items-center gap-2 px-3 py-2 text-sm text-red-600 hover:bg-red-50 transition text-left"><i data-lucide="trash-2" class="w-4 h-4"></i> Supprimer</button>
  </div>

  <script src="./assets/js/api.js"></script>
  <script>
    let myId = null, curConv = null, ws = null, seen = new Set();
    let curOther = null; // l'autre participant de la conversation ouverte
    let CONVS = [];      // liste des conversations (avec l'état de blocage)
    // Annonce à laquelle on répond ("offre:12" / "demande:5") quand on arrive via « Proposer mon aide »
    let pendingHelp = null;

    function showView(v) {
      document.getElementById('view-list').classList.toggle('on', v === 'list');
      document.getElementById('view-chat').classList.toggle('on', v === 'chat');
      if (v === 'list') closeWs();
    }
    function closeWs() { if (ws) { try { ws.close(); } catch (e) {} ws = null; } }

    // ---- Modale profil de l'interlocuteur (clic sur sa photo) ----
    async function openOtherProfile() {
      if (!curOther || !curOther.id) return;
      const modal = document.getElementById('chatProfileModal');
      modal.classList.remove('hidden'); modal.classList.add('flex');
      let u = curOther;
      try { u = await getUser(curOther.id); } catch (_) {}
      document.getElementById('cp_photo').src = avatar(u);
      document.getElementById('cp_name').textContent = ((u.prenom || '') + ' ' + (u.nom || '')).trim() || 'Utilisateur';
      document.getElementById('cp_role').textContent = (u.filiere || '') + (u.niveau ? ' · ' + u.niveau : '');
      const bio = document.getElementById('cp_bio');
      bio.textContent = u.bio || ''; bio.style.display = u.bio ? '' : 'none';
      const comp = u.competences || [];
      document.getElementById('cp_skills').innerHTML = comp.length
        ? comp.map(x => '<span class="text-xs font-medium px-2.5 py-1 rounded-full" style="background:#FCE6D8;color:#C2410C">' + esc(x) + '</span>').join('')
        : '<span class="text-xs text-muted">—</span>';
      const pw = document.getElementById('cp_phone_wrap');
      if (u.telephone) {
        pw.style.display = '';
        const a = document.getElementById('cp_phone');
        a.textContent = u.telephone; a.href = 'tel:' + u.telephone;
      } else { pw.style.display = 'none'; }
      lucide.createIcons();
    }
    function closeChatProfile() {
      const m = document.getElementById('chatProfileModal');
      m.classList.add('hidden'); m.classList.remove('flex');
    }
    document.getElementById('chatProfileModal').addEventListener('click', e => {
      if (e.target.id === 'chatProfileModal') closeChatProfile();
    });

    // ---- Nouvelle conversation par email ----
    function openNewConv() {
      const m = document.getElementById('newConvModal');
      m.classList.remove('hidden'); m.classList.add('flex');
      const inp = document.getElementById('newConvEmail');
      inp.value = ''; setTimeout(() => inp.focus(), 50);
      lucide.createIcons();
    }
    function closeNewConv() {
      const m = document.getElementById('newConvModal');
      m.classList.add('hidden'); m.classList.remove('flex');
    }
    document.getElementById('newConvModal').addEventListener('click', e => {
      if (e.target.id === 'newConvModal') closeNewConv();
    });
    async function startByEmail() {
      const email = (document.getElementById('newConvEmail').value || '').trim();
      if (!email) { toast('Saisis un email.', 'info'); return; }
      try {
        const u = await api('/users/by-email?email=' + encodeURIComponent(email));
        closeNewConv();
        const convId = await startConversation(u.id);
        let other = { id: u.id, prenom: u.prenom, nom: u.nom };
        try { other = await getUser(u.id); } catch (_) {}
        await loadConversations();
        openConversation(convId, other);
      } catch (err) {
        // 404 -> « Aucun utilisateur n'utilise cet email. »
        toast(err.message || 'Aucun utilisateur avec cet email.', 'error');
      }
    }

    // ---- Menu ⋮ de la conversation (Bloquer / Supprimer) ----
    function toggleChatMenu(e) {
      if (e) e.stopPropagation();
      const m = document.getElementById('chatMenu');
      m.classList.toggle('hidden');
      if (!m.classList.contains('hidden')) lucide.createIcons();
    }
    document.addEventListener('click', e => {
      const m = document.getElementById('chatMenu');
      if (m && !m.classList.contains('hidden') && !e.target.closest('#chatMenu') && !e.target.closest('button[onclick="toggleChatMenu(event)"]')) {
        m.classList.add('hidden');
      }
    });

    // État de blocage de la conversation ouverte
    function currentBlock() {
      const c = CONVS.find(x => x.id === curConv);
      return { mine: !!(c && c.bloque_par_moi), other: !!(c && c.bloque_par_autre) };
    }
    function otherName() {
      return ((curOther && curOther.prenom || '') + ' ' + (curOther && curOther.nom || '')).trim() || 'cet utilisateur';
    }

    // Affiche le composer normal OU le bandeau de blocage, et adapte le menu ⋮
    function renderComposer() {
      const b = currentBlock();
      const composer = document.getElementById('composer');
      const notice = document.getElementById('blockNotice');
      const menuBtn = document.getElementById('menuBlockBtn');
      if (b.mine) {
        composer.classList.add('hidden');
        notice.classList.remove('hidden');
        notice.innerHTML = '<i data-lucide="ban" class="w-4 h-4 inline-block text-muted align-text-bottom mr-1"></i>'
          + '<span class="text-sm text-muted">Vous avez bloqué ' + esc(otherName()) + '.</span> '
          + '<button onclick="unblockCurrent()" class="text-sm text-brand font-semibold hover:underline ml-1">Débloquer</button>';
      } else if (b.other) {
        composer.classList.add('hidden');
        notice.classList.remove('hidden');
        notice.innerHTML = '<i data-lucide="ban" class="w-4 h-4 inline-block text-muted align-text-bottom mr-1"></i>'
          + '<span class="text-sm text-muted">Vous avez été bloqué. Vous ne pouvez pas envoyer de message.</span>';
      } else {
        composer.classList.remove('hidden');
        notice.classList.add('hidden');
      }
      // Menu : « Débloquer » si je l'ai bloqué, sinon « Bloquer »
      menuBtn.innerHTML = b.mine
        ? '<i data-lucide="user-check" class="w-4 h-4 text-muted"></i> Débloquer'
        : '<i data-lucide="ban" class="w-4 h-4 text-muted"></i> Bloquer';
      lucide.createIcons();
    }

    function toggleBlockCurrent() {
      const b = currentBlock();
      if (b.mine) unblockCurrent(); else blockCurrent();
    }

    async function blockCurrent() {
      document.getElementById('chatMenu').classList.add('hidden');
      if (!curOther || !curOther.id) return;
      if (!confirm('Bloquer ' + otherName() + ' ? Vous ne pourrez plus échanger de messages.')) return;
      try {
        await api('/users/me/block/' + curOther.id, { method: 'POST' });
        toast(otherName() + ' a été bloqué', 'success');
        await loadConversations(); // met à jour l'état + grise la conversation dans la liste
        renderComposer();          // bascule sur le bandeau « Vous avez bloqué … »
        refreshBadges();
      } catch (err) { toast(err.message || 'Erreur', 'error'); }
    }

    async function unblockCurrent() {
      document.getElementById('chatMenu').classList.add('hidden');
      if (!curOther || !curOther.id) return;
      try {
        await api('/users/me/block/' + curOther.id, { method: 'DELETE' });
        toast(otherName() + ' a été débloqué', 'success');
        await loadConversations();
        renderComposer();
        refreshBadges();
      } catch (err) { toast(err.message || 'Erreur', 'error'); }
    }

    async function deleteCurrentConv() {
      document.getElementById('chatMenu').classList.add('hidden');
      if (!curConv) return;
      if (!confirm('Supprimer cette conversation ? Tous les messages seront définitivement effacés.')) return;
      try {
        await api('/conversations/' + curConv, { method: 'DELETE' });
        toast('Conversation supprimée', 'success');
        closeWs(); curConv = null; curOther = null;
        showView('list');
        await loadConversations();
        refreshBadges();
      } catch (err) { toast(err.message || 'Erreur', 'error'); }
    }

    async function loadConversations() {
      const list = document.getElementById('convList');
      let convs = [];
      try { convs = await api('/conversations/'); } catch (e) {}
      CONVS = convs || [];
      list.innerHTML = '';
      if (!convs.length) {
        list.innerHTML = '<p class="p-6 text-sm text-muted text-center">Aucune conversation. Contacte un mentor depuis « Mentors » ou réponds à une annonce dans « Offres ».</p>';
        return;
      }
      for (const c of convs) {
        const otherId = (c.participants || []).find(p => p !== myId);
        let other = { prenom: 'Utilisateur', nom: '', filiere: '', niveau: '' };
        if (otherId) { try { other = await getUser(otherId); } catch (e) {} }
        const nom    = ((other.prenom || '') + ' ' + (other.nom || '')).trim() || 'Utilisateur';
        const sousTitre = [other.filiere, other.niveau].filter(Boolean).join(' · ');
        const infos  = sousTitre ? (nom + ' | ' + sousTitre) : nom;
        const bloque = c.bloque_par_moi || c.bloque_par_autre;
        const last   = bloque ? 'Conversation bloquée' : (c.dernier_message ? esc(c.dernier_message) : 'Démarrer la conversation');
        const heure  = c.dernier_message_at ? convTime(c.dernier_message_at) : '';
        const div = document.createElement('div');
        div.className = 'flex items-center gap-3 p-4 hover:bg-app transition cursor-pointer' + (bloque ? ' opacity-60' : '');
        div.dataset.search = (nom + ' ' + (other.filiere || '') + ' ' + (other.niveau || '')).toLowerCase();
        div.onclick = () => openConversation(c.id, other);
        div.innerHTML =
          '<img src="' + avatar(other) + '" class="w-12 h-12 rounded-full object-cover bg-app shrink-0" alt="" />'
          + '<div class="flex-1 min-w-0">'
          +   '<p class="font-semibold truncate">' + esc(infos) + '</p>'
          +   '<p class="text-sm text-muted truncate">' + last + '</p>'
          + '</div>'
          + '<div class="flex flex-col items-end gap-1 shrink-0 ml-2">'
          +   '<span class="text-xs text-muted whitespace-nowrap">' + esc(heure) + '</span>'
          +   (c.messages_non_lus ? '<span class="text-xs bg-brand text-white rounded-full w-5 h-5 flex items-center justify-center">' + c.messages_non_lus + '</span>' : '')
          + '</div>';
        list.appendChild(div);
      }
      filterConvs(); // réapplique la recherche en cours
    }

    // Filtre la liste des conversations par nom / filière / niveau
    function filterConvs() {
      const q = (document.getElementById('convSearch').value || '').trim().toLowerCase();
      document.querySelectorAll('#convList > div').forEach(d => {
        d.style.display = (!q || (d.dataset.search || '').includes(q)) ? '' : 'none';
      });
    }

    async function openConversation(id, other) {
      curConv = id;
      curOther = other || null;
      document.getElementById('chatMenu').classList.add('hidden');
      seen = new Set();
      if (other) {
        document.getElementById('chatName').textContent = ((other.prenom || '') + ' ' + (other.nom || '')).trim() || 'Conversation';
        document.getElementById('chatAvatar').src = avatar(other);
      }
      showView('chat');
      const box = document.getElementById('msgBox');
      box.innerHTML = '<div class="text-center text-xs text-muted">Chargement…</div>';
      let msgs = [];
      try { msgs = await api('/conversations/' + id + '/messages'); } catch (e) {}
      box.innerHTML = '';
      msgs.forEach(appendMsg);
      scrollBottom();
      connectWs(id);
      renderComposer();
    }

    function isImgFile(name) { return /\.(jpe?g|png|gif|webp)$/i.test(name || ''); }
    function isAudioFile(name) { return /\.(webm|ogg|oga|mp3|wav|m4a|aac)$/i.test(name || ''); }

    // Corps d'une bulle : pièce jointe (image, audio ou lien) ou texte
    function msgBody(m, mine) {
      if (m.fichier_url) {
        if (isAudioFile(m.fichier_nom) || isAudioFile(m.fichier_url)) {
          return '<audio controls preload="metadata" src="' + m.fichier_url + '" style="width:230px;height:40px"></audio>';
        }
        if (isImgFile(m.fichier_nom) || isImgFile(m.fichier_url)) {
          return '<a href="' + m.fichier_url + '" target="_blank"><img src="' + m.fichier_url + '" class="rounded-lg max-w-[220px] max-h-[220px] object-cover" alt="" /></a>';
        }
        const cls = mine ? 'text-white' : 'text-brand';
        return '<a href="' + m.fichier_url + '" target="_blank" download class="text-sm flex items-center gap-1.5 underline ' + cls + '"><i data-lucide="file" class="w-4 h-4"></i> ' + esc(m.fichier_nom || 'Fichier') + '</a>';
      }
      return '<p class="text-sm msg-text">' + esc(m.contenu) + '</p>';
    }

    function appendMsg(m) {
      if (seen.has(m.id)) return; seen.add(m.id);
      const mine = m.expediteur_id === myId;
      const t = m.envoye_a ? new Date(m.envoye_a).toLocaleTimeString('fr-FR', { hour: '2-digit', minute: '2-digit' }) : '';
      const wrap = document.createElement('div');
      wrap.className = 'flex items-center gap-1.5 group' + (mine ? ' justify-end' : '');
      wrap.dataset.mid = m.id;
      if (m.fichier_url) wrap.dataset.file = '1';
      const bubble = '<div class="' + (mine ? 'bg-brand text-white rounded-2xl rounded-tr-md' : 'bg-white border border-line rounded-2xl rounded-tl-md')
        + ' px-4 py-2 max-w-[75%]">' + msgBody(m, mine)
        + '<p class="text-[10px] ' + (mine ? 'text-white/70' : 'text-muted') + ' mt-1">' + t + '</p></div>';
      // Bouton ⋮ uniquement sur mes messages (modifier / supprimer)
      const dots = mine
        ? '<button onclick="toggleMsgMenu(event,' + m.id + ')" class="opacity-0 group-hover:opacity-100 transition text-muted hover:text-ink w-6 h-6 flex items-center justify-center shrink-0"><i data-lucide="more-vertical" class="w-4 h-4"></i></button>'
        : '';
      wrap.innerHTML = mine ? (dots + bubble) : bubble;
      document.getElementById('msgBox').appendChild(wrap);
      lucide.createIcons();
    }
    function scrollBottom() { const b = document.getElementById('msgBox'); b.scrollTop = b.scrollHeight; }

    // ---- Menu ⋮ d'un message (Modifier / Supprimer) ----
    let menuMsgId = null;
    function toggleMsgMenu(e, id) {
      e.stopPropagation();
      const menu = document.getElementById('msgMenu');
      if (menuMsgId === id && !menu.classList.contains('hidden')) { menu.classList.add('hidden'); menuMsgId = null; return; }
      menuMsgId = id;
      // Pour un fichier : pas de « Modifier », uniquement « Supprimer »
      const w = document.querySelector('[data-mid="' + id + '"]');
      document.getElementById('menuEditBtn').style.display = (w && w.dataset.file) ? 'none' : '';
      const r = e.currentTarget.getBoundingClientRect();
      menu.classList.remove('hidden');
      // positionne le menu sous le bouton (ouverture vers le bas), sans déborder à droite
      menu.style.top = (r.bottom + 6) + 'px';
      menu.style.left = Math.max(8, Math.min(r.left, window.innerWidth - menu.offsetWidth - 8)) + 'px';
      lucide.createIcons();
    }
    document.addEventListener('click', e => {
      const menu = document.getElementById('msgMenu');
      if (menu && !menu.classList.contains('hidden') && !e.target.closest('#msgMenu')
          && !e.target.closest('button[onclick^="toggleMsgMenu"]')) {
        menu.classList.add('hidden'); menuMsgId = null;
      }
    });

    // Envoi d'un fichier en pièce jointe
    async function sendFile(input) {
      const file = input.files[0];
      input.value = '';
      if (!file || !curConv) return;
      if (file.size > 5 * 1024 * 1024) { toast('Fichier trop lourd (5 Mo max)', 'error'); return; }
      try {
        const m = await uploadFile('/conversations/' + curConv + '/messages/fichier', file);
        appendMsg(m); scrollBottom();
      } catch (err) { toast(err.message || 'Envoi du fichier impossible', 'error'); }
    }

    // ---- Message vocal (enregistrement micro) ----
    let mediaRecorder = null, audioChunks = [], recording = false;
    function updateMicUI(on) {
      const btn = document.getElementById('micBtn');
      if (on) {
        btn.classList.add('bg-red-500', 'text-white'); btn.classList.remove('text-muted', 'hover:bg-app');
        btn.title = 'Arrêter et envoyer';
        btn.innerHTML = '<i data-lucide="square" class="w-[18px] h-[18px]"></i>';
      } else {
        btn.classList.remove('bg-red-500', 'text-white'); btn.classList.add('text-muted', 'hover:bg-app');
        btn.title = 'Message vocal';
        btn.innerHTML = '<i data-lucide="mic" class="w-[18px] h-[18px]"></i>';
      }
      lucide.createIcons();
    }
    async function toggleRecord() {
      if (recording) { // arrêter -> déclenche l'envoi
        recording = false; updateMicUI(false);
        if (mediaRecorder && mediaRecorder.state !== 'inactive') mediaRecorder.stop();
        return;
      }
      if (!curConv) { toast('Ouvre une conversation d\'abord', 'info'); return; }
      if (!navigator.mediaDevices || !window.MediaRecorder) { toast('Enregistrement audio non supporté par ce navigateur', 'error'); return; }
      try {
        const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
        audioChunks = [];
        mediaRecorder = new MediaRecorder(stream);
        mediaRecorder.ondataavailable = e => { if (e.data && e.data.size) audioChunks.push(e.data); };
        mediaRecorder.onstop = async () => {
          stream.getTracks().forEach(t => t.stop());
          const blob = new Blob(audioChunks, { type: 'audio/webm' });
          if (!blob.size || !curConv) return;
          const file = new File([blob], 'vocal-' + Date.now() + '.webm', { type: 'audio/webm' });
          if (file.size > 5 * 1024 * 1024) { toast('Vocal trop long (5 Mo max)', 'error'); return; }
          try {
            const m = await uploadFile('/conversations/' + curConv + '/messages/fichier', file);
            appendMsg(m); scrollBottom();
          } catch (err) { toast(err.message || 'Envoi du vocal impossible', 'error'); }
        };
        mediaRecorder.start();
        recording = true; updateMicUI(true);
      } catch (err) {
        toast('Micro non autorisé', 'error');
      }
    }

    async function editMsg() {
      const id = menuMsgId;
      document.getElementById('msgMenu').classList.add('hidden'); menuMsgId = null;
      if (!id || !curConv) return;
      const p = document.querySelector('[data-mid="' + id + '"] .msg-text');
      const old = p ? p.textContent : '';
      const txt = prompt('Modifier le message :', old);
      if (txt === null) return;
      const v = txt.trim();
      if (!v || v === old) return;
      try {
        await api('/conversations/' + curConv + '/messages/' + id, { method: 'PUT', body: { contenu: v } });
        if (p) p.textContent = v;
      } catch (err) { toast(err.message || 'Modification impossible', 'error'); }
    }

    async function deleteMsg() {
      const id = menuMsgId;
      document.getElementById('msgMenu').classList.add('hidden'); menuMsgId = null;
      if (!id || !curConv) return;
      if (!confirm('Supprimer ce message ?')) return;
      try {
        await api('/conversations/' + curConv + '/messages/' + id, { method: 'DELETE' });
        const w = document.querySelector('[data-mid="' + id + '"]');
        if (w) w.remove();
        seen.delete(id);
      } catch (err) { toast(err.message || 'Suppression impossible', 'error'); }
    }

    // Heure pour l'aperçu d'une conversation : HH:MM si aujourd'hui, "Hier", sinon date courte
    function convTime(iso) {
      const d = new Date(iso);
      if (isNaN(d)) return '';
      const now = new Date();
      const sameDay = d.toDateString() === now.toDateString();
      if (sameDay) return d.toLocaleTimeString('fr-FR', { hour: '2-digit', minute: '2-digit' });
      const hier = new Date(now); hier.setDate(now.getDate() - 1);
      if (d.toDateString() === hier.toDateString()) return 'Hier';
      return d.toLocaleDateString('fr-FR', { day: 'numeric', month: 'short' });
    }

    async function sendMsg() {
      const inp = document.getElementById('msgInput');
      const txt = inp.value.trim();
      if (!txt || !curConv) return;
      inp.value = '';
      try {
        const m = await api('/conversations/' + curConv + '/messages', { method: 'POST', body: { contenu: txt } });
        appendMsg(m); scrollBottom();

        // Si on est venu via « Proposer mon aide » : on enregistre la réponse à l'annonce,
        // puis on grise le bouton (mémorisé pour la page Offres).
        if (pendingHelp) {
          const [kind, id] = pendingHelp.split(':');
          try {
            await api('/' + (kind === 'offre' ? 'offres' : 'demandes') + '/' + id + '/repondre',
              { method: 'POST', body: { message: txt } });
          } catch (_) { /* déjà répondu : on ignore */ }
          markHelped(kind, id);
          pendingHelp = null;
          refreshBadges();
        }
      } catch (err) { toast(err.message || 'Envoi impossible', 'error'); inp.value = txt; }
    }

    function connectWs(id) {
      closeWs();
      try {
        ws = new WebSocket(API_BASE.replace(/^http/, 'ws') + '/conversations/ws/' + id + '?token=' + encodeURIComponent(getToken()));
        ws.onmessage = ev => {
          try {
            const d = JSON.parse(ev.data);
            if (d.event === 'edit') {
              const p = document.querySelector('[data-mid="' + d.id + '"] .msg-text');
              if (p) p.textContent = d.contenu;
              return;
            }
            if (d.event === 'delete') {
              const w = document.querySelector('[data-mid="' + d.id + '"]');
              if (w) w.remove();
              seen.delete(d.id);
              return;
            }
            if (d.event) return; // ex: "typing"
            if (d.id && d.expediteur_id !== myId) {
              appendMsg({ id: d.id, contenu: d.contenu, expediteur_id: d.expediteur_id, envoye_a: d.envoye_a, fichier_url: d.fichier_url, fichier_nom: d.fichier_nom });
              scrollBottom();
            }
          } catch (e) {}
        };
      } catch (e) {}
    }

    document.addEventListener('keydown', e => {
      if (e.key === 'Enter' && document.activeElement && document.activeElement.id === 'msgInput') {
        e.preventDefault(); sendMsg();
      }
    });

    (async function init() {
      requireAuth();
      try { const me = await getMe(); myId = me.id; } catch (e) { return; }
      await loadConversations();
      refreshBadges();
      const params = new URLSearchParams(location.search);
      const conv = params.get('conv');
      const prefill = params.get('prefill');
      pendingHelp = params.get('help'); // ex: "demande:5"
      if (conv) {
        // récupère l'autre participant pour le titre
        let other = null;
        try {
          const convs = await api('/conversations/');
          const c = (convs || []).find(x => x.id === +conv);
          if (c) { const oid = (c.participants || []).find(p => p !== myId); if (oid) other = await getUser(oid); }
        } catch (e) {}
        await openConversation(+conv, other);
        // Message prérempli (« Proposer mon aide » / « Demander de l'aide »)
        if (prefill) {
          const inp = document.getElementById('msgInput');
          inp.value = prefill;
          inp.focus();
        }
        refreshBadges(); // les messages de cette conv viennent d'être marqués lus
      }
    })();

    lucide.createIcons();
  </script>
</body>
</html>

<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>MentorLink — Offres & demandes</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = { theme: { extend: {
      colors: { brand: '#0965F0', ink: '#1B2330', muted: '#52607A', line: '#E4ECFB', app: '#F4F8FF' },
      fontFamily: { sans: ['Poppins', 'sans-serif'] }
    }}}
  </script>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <script src="https://unpkg.com/lucide@latest"></script>
  <style>
    html, body { height: 100%; }
    body { font-family: 'Poppins', sans-serif; color: #1B2330; background: #A8C0E4; }
    .no-sb { -ms-overflow-style: none; scrollbar-width: none; }
    .no-sb::-webkit-scrollbar { display: none; }
    .seg { color:#52607A; padding-bottom:.65rem; border-bottom:2px solid transparent; margin-bottom:-1px; }
    .seg:hover { color:#1B2330; }
    .seg.on { color:#0965F0; border-bottom-color:#0965F0; }
    .pick.on { background:#0965F0; color:#fff; border-color:#0965F0; }
    .lst { display:none; }
    .lst.on { display:block; }
  </style>
</head>
<body class="p-4 lg:p-6">

  <!-- Squelette de chargement (skeleton) -->
  <style>
    #skel{transition:opacity .4s ease}
    #skel.hide{opacity:0;pointer-events:none}
    .sk{background:#DDE7F7;position:relative;overflow:hidden}
    .sk::after{content:'';position:absolute;inset:0;transform:translateX(-100%);background:linear-gradient(90deg,transparent,rgba(255,255,255,.65),transparent);animation:sksh 1.3s infinite}
    @keyframes sksh{100%{transform:translateX(100%)}}
  </style>
  <div id="skel" class="fixed inset-0 z-[60] p-4 lg:p-6" style="background:#A8C0E4">
    <div class="max-w-[1280px] mx-auto h-[calc(100vh-2rem)] lg:h-[calc(100vh-3rem)] bg-white rounded-lg overflow-hidden flex">
      <div class="w-60 shrink-0 hidden lg:flex flex-col border-r border-line p-5">
        <div class="sk w-20 h-20 rounded-full mx-auto mb-8"></div>
        <div class="space-y-3"><div class="sk h-9 rounded-lg"></div><div class="sk h-9 rounded-lg"></div><div class="sk h-9 rounded-lg"></div></div>
        <div class="sk mt-auto h-28 rounded-2xl"></div>
      </div>
      <div class="flex-1 p-6">
        <div class="sk h-12 w-2/5 rounded-full mb-6"></div>
        <div class="space-y-3"><div class="sk h-20 rounded-2xl"></div><div class="sk h-20 rounded-2xl"></div><div class="sk h-20 rounded-2xl"></div></div>
      </div>
    </div>
  </div>
  <script>window.addEventListener('load',function(){setTimeout(function(){var s=document.getElementById('skel');if(s){s.classList.add('hide');setTimeout(function(){s.style.display='none';},400);}},300);});</script>

  <div class="max-w-[1280px] mx-auto h-[calc(100vh-2rem)] lg:h-[calc(100vh-3rem)] bg-white rounded-lg overflow-hidden flex" style="box-shadow:0 -8px 24px rgba(11,27,58,.10), 0 18px 45px rgba(11,27,58,.20)">

    <!-- ===================== SIDEBAR ===================== -->
    <aside class="w-60 shrink-0 hidden lg:flex flex-col border-r border-line p-5">
      <div class="flex justify-center mb-8">
        <img src="./assets/img/logo.png" class="h-28 w-28 object-contain" />
      </div>
      <nav class="space-y-2">
        <a href="dashboard.html" class="flex items-center gap-2.5 px-3 h-9 text-[13px] text-muted font-medium hover:text-ink transition"><i data-lucide="home" class="w-[18px] h-[18px] stroke-[2.4]"></i> Tableau de bord</a>
        <a href="matching.html" class="flex items-center gap-2.5 px-3 h-9 text-[13px] text-muted font-medium hover:text-ink transition"><i data-lucide="users" class="w-[18px] h-[18px] stroke-[2.4]"></i> Mentors</a>
        <a href="offres.html" class="flex items-center gap-2.5 px-3 h-9 text-[13px] text-brand font-semibold"><i data-lucide="megaphone" class="w-[18px] h-[18px] stroke-[2.4]"></i> Offres <span id="offreBadge" class="ml-auto text-xs bg-brand text-white rounded-full w-5 h-5 flex items-center justify-center" style="display:none">0</span></a>
        <a href="chat.html" class="flex items-center gap-2.5 px-3 h-9 text-[13px] text-muted font-medium hover:text-ink transition"><i data-lucide="message-circle" class="w-[18px] h-[18px] stroke-[2.4]"></i> Messages <span id="msgBadge" class="ml-auto text-xs bg-brand text-white rounded-full w-5 h-5 flex items-center justify-center" style="display:none">0</span></a>
      </nav>
      <div class="mt-auto bg-brand/5 border border-brand/10 rounded-[2px] p-2 text-center">
        <img src="./assets/img/help.svg" class="h-12 mb-1 object-contain mx-auto" />
        <p class="font-semibold text-[13px]">Besoin d'aide ?</p>
        <p class="text-[10px] text-muted mt-0.5">Contacte-nous en cas de problème</p>
      </div>
      <a href="#" onclick="confirmLogout();return false;" class="flex items-center gap-2.5 px-3 h-9 mt-3 text-[13px] font-medium text-red-500 hover:text-red-600 transition"><i data-lucide="log-out" class="w-[18px] h-[18px] stroke-[2.4]"></i> Se déconnecter</a>
    </aside>

    <!-- ===================== CENTRE ===================== -->
    <main class="flex-1 bg-white overflow-y-auto no-sb p-6">

      <div class="flex items-center justify-between mb-5">
        <div>
          <h1 class="text-2xl font-extrabold text-ink">Offres &amp; demandes</h1>
          <p class="text-sm text-ink/70">Propose ton aide ou trouve quelqu'un pour la tienne.</p>
        </div>
        <button onclick="openModal()" class="bg-brand hover:brightness-110 text-white text-[13px] font-semibold px-4 h-9 rounded-full transition flex items-center gap-1.5"><i data-lucide="plus" class="w-3.5 h-3.5"></i> Publier</button>
      </div>

      <!-- Onglets (style souligné) -->
      <div class="flex flex-wrap gap-x-7 gap-y-2 border-b border-line mb-6">
        <button id="tab-demandes" onclick="showTab('demandes')" class="seg on text-sm font-semibold transition">Demandes de mentorat</button>
        <button id="tab-mesdemandes" onclick="showTab('mesdemandes')" class="seg text-sm font-semibold transition">Mes demandes</button>
        <button id="tab-mesoffres" onclick="showTab('mesoffres')" class="seg text-sm font-semibold transition">Mes offres</button>
      </div>

      <!-- Demandes des AUTRES -->
      <div id="list-demandes" class="lst on"></div>

      <!-- MES demandes -->
      <div id="list-mesdemandes" class="lst"></div>

      <!-- MES offres -->
      <div id="list-mesoffres" class="lst"></div>

    </main>
  </div>

  <!-- ===================== MODAL PUBLIER ===================== -->
  <div id="modal" class="fixed inset-0 z-[70] hidden items-center justify-center bg-black/40 p-4">
    <div class="bg-white rounded-2xl w-full max-w-md p-6">
      <div class="flex items-center justify-between mb-4">
        <h2 class="text-lg font-extrabold">Publier une annonce</h2>
        <button onclick="closeModal()" class="w-9 h-9 rounded-full hover:bg-app text-muted flex items-center justify-center transition"><i data-lucide="x" class="w-5 h-5"></i></button>
      </div>
      <form onsubmit="event.preventDefault(); publishAnnonce();" class="space-y-4">
        <div>
          <label class="block text-sm font-semibold mb-2">Type d'annonce</label>
          <div class="flex gap-2" onclick="pickType(event)">
            <button type="button" class="pick on flex-1 h-10 rounded-xl border border-line text-sm font-medium">Je propose (offre)</button>
            <button type="button" class="pick flex-1 h-10 rounded-xl border border-line text-sm font-medium">Je cherche (demande)</button>
          </div>
        </div>
        <div>
          <label class="block text-sm font-semibold mb-1.5">Matière</label>
          <select id="pubMatiere" class="w-full h-11 bg-app border border-line rounded-xl px-3 text-sm focus:border-brand focus:outline-none">
            <option>Programmation Python</option><option>Algorithmique</option><option>Bases de données</option><option>SQL</option><option>Développement web</option><option>HTML/CSS</option><option>Java</option><option>POO</option><option>Mathématiques</option><option>Statistiques</option><option>Réseaux</option><option>Anglais</option>
          </select>
        </div>
        <div>
          <label class="block text-sm font-semibold mb-1.5">Format</label>
          <select id="pubFormat" class="w-full h-11 bg-app border border-line rounded-xl px-3 text-sm focus:border-brand focus:outline-none">
            <option>Présentiel</option><option>En ligne</option><option>Les deux</option>
          </select>
        </div>
        <div>
          <label class="block text-sm font-semibold mb-1.5">Disponibilité</label>
          <div class="grid grid-cols-3 gap-2">
            <select id="pubJour" class="h-11 bg-app border border-line rounded-xl px-2 text-sm focus:border-brand focus:outline-none">
              <option>Lundi</option><option>Mardi</option><option>Mercredi</option><option>Jeudi</option><option>Vendredi</option><option>Samedi</option><option>Dimanche</option>
            </select>
            <input id="pubHd" type="time" value="14:00" class="h-11 bg-app border border-line rounded-xl px-2 text-sm focus:border-brand focus:outline-none" />
            <input id="pubHf" type="time" value="16:00" class="h-11 bg-app border border-line rounded-xl px-2 text-sm focus:border-brand focus:outline-none" />
          </div>
        </div>
        <button class="w-full h-11 rounded-full bg-brand hover:brightness-110 text-white font-semibold transition">Publier l'annonce</button>
      </form>
    </div>
  </div>

  <!-- ===================== FENÊTRE PROFIL (auteur de l'annonce) ===================== -->
  <div id="annonceModal" class="fixed inset-0 z-[80] hidden items-center justify-center bg-black/40 p-4">
    <div class="bg-white rounded-2xl w-full max-w-md max-h-[90vh] overflow-y-auto no-sb">
      <!-- Hero : fond couleur du body + logo (comme la page profil) -->
      <div class="relative h-32 overflow-hidden" style="background:#A8C0E4">
        <img src="./assets/img/logo.png" alt="MentorLink" class="absolute left-1/2 top-1/2 -translate-x-1/2 -translate-y-1/2 h-24 object-contain pointer-events-none select-none" />
        <button onclick="closeAnnonceModal()" class="absolute top-3 right-3 w-9 h-9 rounded-full bg-white/80 hover:bg-white text-ink flex items-center justify-center transition"><i data-lucide="x" class="w-5 h-5"></i></button>
      </div>
      <div class="px-6 pb-6">
        <img id="am_photo" onclick="showImage(this.src)" title="Voir en grand" src="./assets/img/profil.svg" alt="" class="w-20 h-20 rounded-full object-cover bg-white -mt-10 ring-4 ring-white shadow-lg relative z-10 cursor-zoom-in" />
        <h2 id="am_name" class="mt-3 text-xl font-extrabold leading-tight">…</h2>
        <p id="am_role" class="text-sm text-muted mt-0.5">…</p>
        <p id="am_bio" class="text-sm text-ink/80 mt-2" style="display:none"></p>

        <div class="mt-4 bg-app border border-line rounded-xl px-3 py-2.5">
          <p class="text-xs font-semibold text-muted mb-1 flex items-center gap-1.5"><i data-lucide="megaphone" class="w-3.5 h-3.5"></i> <span id="am_kindlabel">Offre</span></p>
          <p id="am_matiere" class="text-sm font-semibold text-ink"></p>
        </div>

        <div class="mt-4">
          <p class="text-xs font-semibold text-muted mb-2 flex items-center gap-1.5"><i data-lucide="star" class="w-3.5 h-3.5"></i> Points forts</p>
          <div id="am_skills" class="flex flex-wrap gap-1.5"></div>
        </div>

        <div id="am_phone_wrap" class="mt-4" style="display:none">
          <p class="text-xs font-semibold text-muted mb-1 flex items-center gap-1.5"><i data-lucide="phone" class="w-3.5 h-3.5"></i> Téléphone</p>
          <a id="am_phone" href="#" class="text-sm font-semibold text-brand"></a>
        </div>

        <div id="am_action" class="mt-5"></div>
      </div>
    </div>
  </div>

  <script src="./assets/js/api.js"></script>
  <script>
    // Bascule entre les onglets : demandes (des autres) / mesdemandes / mesoffres
    function showTab(t) {
      ['demandes', 'mesdemandes', 'mesoffres'].forEach(x => {
        document.getElementById('tab-' + x).classList.toggle('on', x === t);
        document.getElementById('list-' + x).classList.toggle('on', x === t);
      });
    }
    // Toutes les matières (pour les demandes) et les forces de l'utilisateur (pour les offres)
    const ALL_MATIERES = ['Programmation Python','Algorithmique','Bases de données','SQL','Développement web','HTML/CSS','Java','POO','Mathématiques','Statistiques','Réseaux','Anglais'];
    let MY_COMP = [];

    function currentPubType() {
      const on = document.querySelector('.pick.on');
      return (on && on.textContent.indexOf('propose') !== -1) ? 'offre' : 'demande';
    }

    // Offre -> uniquement les forces (compétences) ; Demande -> toutes les matières
    function updateMatiereOptions() {
      const sel = document.getElementById('pubMatiere');
      const isOffre = currentPubType() === 'offre';
      const list = isOffre ? MY_COMP : ALL_MATIERES;
      if (isOffre && !list.length) {
        sel.innerHTML = '<option value="">Ajoute d\'abord tes forces dans « Mon profil »</option>';
        sel.disabled = true;
        return;
      }
      sel.disabled = false;
      sel.innerHTML = list.map(m => '<option>' + esc(m) + '</option>').join('');
    }

    function pickType(e) {
      const b = e.target.closest('.pick'); if (!b) return;
      [...b.parentElement.children].forEach(c => c.classList.remove('on'));
      b.classList.add('on');
      updateMatiereOptions();
    }
    function openModal() { const m = document.getElementById('modal'); m.classList.remove('hidden'); m.classList.add('flex'); updateMatiereOptions(); }
    function closeModal() { const m = document.getElementById('modal'); m.classList.add('hidden'); m.classList.remove('flex'); }

    const fmtIcon = f => { f = (f || '').toLowerCase(); return (f.includes('présent') || f.includes('present')) ? 'map-pin' : (f.includes('ligne') ? 'monitor' : 'globe'); };

    function annonceCard(item, kind, me) {
      const isMine  = item.user_id === me.id;
      const matiere = (item.matieres && item.matieres[0]) ? item.matieres[0] : (item.titre || 'Général');
      const chip    = kind === 'offre' ? matiere : ('Cherche : ' + matiere);
      const format  = item.format || 'les deux';
      const dispo   = (item.disponibilites && item.disponibilites[0]) ? item.disponibilites[0] : '—';
      const owner   = item._owner || { prenom: '', nom: '', filiere: '', niveau: '' };
      const who     = isMine ? 'Toi' : esc((owner.prenom || '') + ' ' + (owner.nom || ''));
      const meta    = isMine
        ? '<span class="text-[11px] align-middle bg-brand/10 text-brand px-2 py-0.5 rounded-full">Mon annonce</span>'
        : '<span class="text-muted font-normal text-sm">· ' + esc((owner.filiere || '') + ' ' + (owner.niveau || '')) + '</span>';
      let btn;
      if (isMine) {
        btn = '<button onclick="removeAnnonce(\'' + kind + '\',' + item.id + ',this)" class="bg-red-500 hover:bg-red-600 text-white text-[13px] font-semibold px-4 h-9 rounded-full flex items-center gap-1.5 transition shrink-0"><i data-lucide="trash-2" class="w-3.5 h-3.5"></i> Supprimer</button>';
      } else {
        btn = '<button onclick="openAnnonceProfile(\'' + kind + '\',' + item.id + ')" class="bg-brand hover:brightness-110 text-white text-[13px] font-semibold px-4 h-9 rounded-full flex items-center gap-1.5 transition shrink-0"><i data-lucide="user" class="w-3.5 h-3.5"></i> Voir le profil</button>';
      }
      return '<div class="flex items-center gap-4 py-4 border-b border-line last:border-b-0">'
        + '<img src="' + avatar(owner) + '" class="w-12 h-12 rounded-full object-cover bg-app shrink-0" alt="" />'
        + '<div class="flex-1 min-w-0"><p class="font-semibold">' + who + ' ' + meta + '</p>'
        + '<div class="flex flex-wrap items-center gap-2 mt-1.5 text-xs">'
        + '<span class="bg-app text-brand px-2 py-0.5 rounded-full">' + esc(chip) + '</span>'
        + '<span class="text-muted flex items-center gap-1"><i data-lucide="' + fmtIcon(format) + '" class="w-3.5 h-3.5"></i> ' + esc(format) + '</span>'
        + '<span class="text-muted flex items-center gap-1"><i data-lucide="calendar" class="w-3.5 h-3.5"></i> ' + esc(dispo) + '</span>'
        + '</div></div>' + btn + '</div>';
    }

    // Cache des annonces chargées (sert à retrouver la matière dans respond())
    const ITEMS = { offre: {}, demande: {} };

    async function loadList(kind) {
      const path = kind === 'offre' ? '/offres/' : '/demandes/';
      const cont = document.getElementById(kind === 'offre' ? 'list-offres' : 'list-demandes');
      let items = [], me;
      try { me = await getMe(); items = await api(path); }
      catch (e) { cont.innerHTML = '<p class="text-ink/70 text-sm bg-white border border-line rounded-2xl p-5">Impossible de charger les annonces.</p>'; return; }
      items.forEach(it => { ITEMS[kind][it.id] = it; });
      await Promise.all(items.map(async it => { try { it._owner = await getUser(it.user_id); } catch (e) {} }));
      if (!items.length) {
        cont.innerHTML = '<p class="text-ink/70 text-sm bg-white border border-line rounded-2xl p-5">Aucune annonce pour le moment. Clique sur « Publier » pour en créer une.</p>';
        return;
      }
      cont.innerHTML = items.map(it => annonceCard(it, kind, me)).join('');
      lucide.createIcons();
    }
    // Par défaut : seulement les demandes que je peux aider. Bouton pour tout voir.
    let SHOW_ALL_DEMANDES = false;
    function toggleAllDemandes() { SHOW_ALL_DEMANDES = !SHOW_ALL_DEMANDES; loadDemandes(); }

    // Demandes des AUTRES. Filtrées sur mes points forts, sauf si « voir toutes ».
    async function loadDemandes() {
      const cont = document.getElementById('list-demandes');
      let items = [], me;
      try { me = await getMe(); items = await api('/demandes/'); }
      catch (e) { cont.innerHTML = '<p class="text-ink/70 text-sm bg-white border border-line rounded-2xl p-5">Impossible de charger les demandes.</p>'; return; }
      const mesForces = (me.competences || []).map(c => (c || '').toLowerCase());
      items = items.filter(it => {
        if (it.user_id === me.id) return false;
        if (SHOW_ALL_DEMANDES) return true;
        return (it.matieres || []).some(m => mesForces.includes((m || '').toLowerCase()));
      });
      items.forEach(it => { ITEMS['demande'][it.id] = it; });
      await Promise.all(items.map(async it => { try { it._owner = await getUser(it.user_id); } catch (e) {} }));

      // Barre avec le bouton bascule
      const bar = '<div class="flex justify-end mb-3">'
        + '<button onclick="toggleAllDemandes()" class="text-[13px] font-semibold text-brand hover:underline flex items-center gap-1.5">'
        + '<i data-lucide="' + (SHOW_ALL_DEMANDES ? 'filter' : 'list') + '" class="w-4 h-4"></i> '
        + (SHOW_ALL_DEMANDES ? 'Voir seulement celles que je peux aider' : 'Voir toutes les demandes')
        + '</button></div>';

      if (!items.length) {
        const msg = SHOW_ALL_DEMANDES
          ? 'Aucune demande publiée pour le moment.'
          : (mesForces.length
              ? 'Aucune demande ne correspond à tes points forts. Clique sur « Voir toutes les demandes » pour tout afficher.'
              : 'Renseigne tes points forts dans « Mon profil », ou clique sur « Voir toutes les demandes ».');
        cont.innerHTML = bar + '<p class="text-ink/70 text-sm bg-white border border-line rounded-2xl p-5">' + msg + '</p>';
        lucide.createIcons();
        return;
      }
      cont.innerHTML = bar + items.map(it => annonceCard(it, 'demande', me)).join('');
      lucide.createIcons();
    }

    // MES demandes (pour les voir et les supprimer)
    async function loadMesDemandes() {
      const cont = document.getElementById('list-mesdemandes');
      let items = [], me;
      try { me = await getMe(); items = await api('/demandes/'); }
      catch (e) { cont.innerHTML = '<p class="text-ink/70 text-sm bg-white border border-line rounded-2xl p-5">Impossible de charger tes demandes.</p>'; return; }
      items = items.filter(it => it.user_id === me.id);
      items.forEach(it => { ITEMS['demande'][it.id] = it; it._owner = me; });
      if (!items.length) {
        cont.innerHTML = '<p class="text-ink/70 text-sm bg-white border border-line rounded-2xl p-5">Tu n\'as publié aucune demande. Clique sur « Publier » puis « Je cherche (demande) ».</p>';
        return;
      }
      cont.innerHTML = items.map(it => annonceCard(it, 'demande', me)).join('');
      lucide.createIcons();
    }

    // Mes offres uniquement (pour les voir et les supprimer)
    async function loadMesOffres() {
      const cont = document.getElementById('list-mesoffres');
      let items = [], me;
      try { me = await getMe(); items = await api('/offres/'); }
      catch (e) { cont.innerHTML = '<p class="text-ink/70 text-sm bg-white border border-line rounded-2xl p-5">Impossible de charger tes offres.</p>'; return; }
      items = items.filter(it => it.user_id === me.id);
      items.forEach(it => { ITEMS['offre'][it.id] = it; it._owner = me; });
      if (!items.length) {
        cont.innerHTML = '<p class="text-ink/70 text-sm bg-white border border-line rounded-2xl p-5">Tu n\'as publié aucune offre. Clique sur « Publier » puis « Je propose (offre) ».</p>';
        return;
      }
      cont.innerHTML = items.map(it => annonceCard(it, 'offre', me)).join('');
      lucide.createIcons();
    }

    // Ouvre la conversation avec un message déjà prérempli.
    // La réponse à l'annonce + le grisage du bouton se font à l'envoi du message (dans chat.html).
    async function respond(kind, id, ownerId, btn) {
      const it = ITEMS[kind][id] || {};
      const matiere = (it.matieres && it.matieres[0]) ? it.matieres[0] : (it.titre || 'ton annonce');
      const prefill = kind === 'offre'
        ? 'Bonjour, je suis intéressé(e) par ton offre en ' + matiere + '. Peux-tu m\'aider ?'
        : 'Bonjour, j\'ai vu ta demande en ' + matiere + '. Je peux t\'aider !';
      btn.disabled = true; const old = btn.textContent; btn.textContent = '…';
      try {
        const convId = await startConversation(ownerId);
        location.href = 'chat.html?conv=' + convId
          + '&prefill=' + encodeURIComponent(prefill)
          + '&help=' + encodeURIComponent(kind + ':' + id);
      } catch (err) { toast(err.message || 'Erreur', 'error'); btn.disabled = false; btn.textContent = old; }
    }

    // ---- Fenêtre profil de l'auteur (action contextuelle dedans) ----
    async function openAnnonceProfile(kind, id) {
      const it = ITEMS[kind][id];
      if (!it) return;
      const modal = document.getElementById('annonceModal');
      modal.classList.remove('hidden'); modal.classList.add('flex');

      let u = it._owner || {};
      try { u = await getUser(it.user_id); } catch (_) {}
      document.getElementById('am_photo').src = avatar(u);
      document.getElementById('am_name').textContent = ((u.prenom || '') + ' ' + (u.nom || '')).trim() || 'Utilisateur';
      document.getElementById('am_role').textContent = (u.filiere || '') + (u.niveau ? ' · ' + u.niveau : '');
      const bio = document.getElementById('am_bio');
      bio.textContent = u.bio || ''; bio.style.display = u.bio ? '' : 'none';

      const matiere = (it.matieres && it.matieres.length) ? it.matieres.join(', ') : (it.titre || '—');
      document.getElementById('am_kindlabel').textContent = kind === 'offre' ? 'Propose (offre)' : 'Cherche (demande)';
      document.getElementById('am_matiere').textContent = matiere;

      const comp = u.competences || [];
      document.getElementById('am_skills').innerHTML = comp.length
        ? comp.map(x => '<span class="text-xs font-medium px-2.5 py-1 rounded-full" style="background:#FCE6D8;color:#C2410C">' + esc(x) + '</span>').join('')
        : '<span class="text-xs text-muted">—</span>';

      // Téléphone (uniquement si l'auteur a choisi de l'afficher)
      const pw = document.getElementById('am_phone_wrap');
      if (u.telephone) {
        pw.style.display = '';
        const a = document.getElementById('am_phone');
        a.textContent = u.telephone; a.href = 'tel:' + u.telephone;
      } else { pw.style.display = 'none'; }

      renderAnnonceAction(kind, id, it.user_id);
      lucide.createIcons();
    }

    // Bouton d'action (Demander / Proposer) selon le type d'annonce, grisé si déjà répondu
    function renderAnnonceAction(kind, id, ownerId) {
      const cont = document.getElementById('am_action');
      if (isHelped(kind, id)) {
        const done = kind === 'offre' ? 'Aide demandée' : 'Aide proposée';
        cont.innerHTML = '<button disabled class="w-full h-11 rounded-full bg-app text-muted font-semibold flex items-center justify-center gap-2 cursor-not-allowed"><i data-lucide="check" class="w-4 h-4"></i> ' + done + '</button>';
      } else {
        const label = kind === 'offre' ? 'Demander de l\'aide' : 'Proposer mon aide';
        const icon  = kind === 'offre' ? 'hand' : 'heart-handshake';
        cont.innerHTML = '<button onclick="respond(\'' + kind + '\',' + id + ',' + ownerId + ',this)" class="w-full h-11 rounded-full bg-brand hover:brightness-110 text-white font-semibold flex items-center justify-center gap-2 transition"><i data-lucide="' + icon + '" class="w-4 h-4"></i> ' + label + '</button>';
      }
      lucide.createIcons();
    }

    function closeAnnonceModal() {
      const m = document.getElementById('annonceModal');
      m.classList.add('hidden'); m.classList.remove('flex');
    }
    document.getElementById('annonceModal').addEventListener('click', e => {
      if (e.target.id === 'annonceModal') closeAnnonceModal();
    });

    async function removeAnnonce(kind, id, btn) {
      if (!confirm('Supprimer cette annonce ?')) return;
      try {
        await api('/' + (kind === 'offre' ? 'offres' : 'demandes') + '/' + id, { method: 'DELETE' });
        if (kind === 'offre') await loadMesOffres(); else await loadMesDemandes();
        toast('Annonce supprimée', 'success');
      } catch (err) { toast(err.message || 'Erreur', 'error'); }
    }

    // Publier une annonce (enregistrée dans la base via l'API)
    async function publishAnnonce() {
      const isOffre = currentPubType() === 'offre';
      const matiere = document.getElementById('pubMatiere').value;
      if (isOffre && (!MY_COMP.length || !matiere)) {
        toast('Pour publier une offre, ajoute d\'abord tes forces dans « Mon profil ».', 'error');
        return;
      }
      const format  = document.getElementById('pubFormat').value.toLowerCase();
      const jour    = document.getElementById('pubJour').value;
      const hd      = document.getElementById('pubHd').value;
      const hf      = document.getElementById('pubHf').value;
      const payload = {
        titre: isOffre ? ('Aide en ' + matiere) : ('Recherche d\'aide en ' + matiere),
        description: '',
        matieres: [matiere],
        disponibilites: [jour + ' ' + hd + '-' + hf],
        format: format
      };
      try {
        await api('/' + (isOffre ? 'offres' : 'demandes') + '/', { method: 'POST', body: payload });
        closeModal();
        if (isOffre) {
          showTab('mesoffres');
          await loadMesOffres();
          toast('Offre publiée ✓', 'success');
        } else {
          showTab('mesdemandes');
          await loadMesDemandes();
          toast('Demande publiée ✓', 'success');
        }
      } catch (err) { toast(err.message || 'Publication impossible', 'error'); }
    }

    // Marque comme lues les notifications « nouvelle offre / demande »
    // (on est sur la page Offres : la pastille du menu doit retomber à zéro).
    async function clearOffreNotifs() {
      try {
        const data = await api('/users/me/notifications');
        const aMarquer = (data.notifications || []).filter(
          n => !n.lu && (n.type === 'nouvelle_offre' || n.type === 'nouvelle_demande')
        );
        await Promise.all(aMarquer.map(n =>
          api('/users/me/notifications/' + n.id + '/lu', { method: 'PUT' }).catch(() => {})
        ));
      } catch (_) {}
    }

    requireAuth();
    (async function init() {
      try { const me = await getMe(); MY_COMP = me.competences || []; } catch (_) {}
      await Promise.all([loadDemandes(), loadMesDemandes(), loadMesOffres()]);
      await clearOffreNotifs();
      refreshBadges();
    })();
    lucide.createIcons();
  </script>
</body>
</html>
